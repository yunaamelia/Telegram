# Pre-commit hooks for local validation
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        files: ^handlers/admin/
        args: ['--line-length=120']

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^handlers/admin/
        args: ['--profile=black']

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--ignore=E501,W503']
        files: ^handlers/admin/

  - repo: local
    hooks:
      - id: validate-structure
        name: Validate Directory Structure
        entry: ./.venv/bin/python scripts/ci/validate_structure.py
        language: system
        pass_filenames: false
        always_run: true
        args: ['--check-only']

      - id: validate-callbacks
        name: Validate Callback Patterns
        entry: ./.venv/bin/python scripts/ci/validate_callbacks.py
        language: system
        pass_filenames: false
        always_run: true
        args: ['--check-only']

      - id: validate-keyboard-layout
        name: Validate Keyboard Layout
        entry: ./.venv/bin/python scripts/ci/validate_keyboard_layout.py
        language: system
        pass_filenames: false
        always_run: true
        args: ['--check-only']
